[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dpml"
version = "0.1.0"
description = "DP-SGD from scratch: per-example gradient clipping, Gaussian noise, and the real privacy-utility tradeoff curve it produces."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Thakur Ajay Kumar" }]
dependencies = ["numpy>=1.24", "scikit-learn>=1.3", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
filterwarnings = ["ignore::FutureWarning", "ignore::UserWarning"]
